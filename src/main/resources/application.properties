spring.application.name=inquiry-system
server.port=8080

# DB: ファイル保存のH2(再起動してもデータが残る)。./data/ に作られる
spring.datasource.url=jdbc:h2:file:./data/inquiry;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
# ログイン導入に合わせて、DBを直接見られるH2コンソールは無効にする
spring.h2.console.enabled=false

spring.thymeleaf.cache=false

# AI下書き用(APIキーは環境変数 GEMINI_API_KEY で渡す。ここには書かない)
# モデル名は変わることがあるので、Google AI Studio で使えるモデル名を確認して書き換える
ai.model=gemini-3.7-flash

# メール送信(Gmail SMTP)。ユーザー名とパスワードは環境変数で渡す(ここには書かない)
# パスワードは Googleアカウントで発行した「アプリパスワード」を使う(ふだんのパスワードは不可)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# 管理者ログイン(ユーザー名とパスワードは環境変数で渡す。未設定だとアプリは起動しない)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
