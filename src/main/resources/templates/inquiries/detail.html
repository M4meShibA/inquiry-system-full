<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${inquiry.subject}">問い合わせ詳細</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
  <p><a th:href="@{/admin/inquiries}">&larr; 一覧へ戻る</a></p>
  <h1 th:text="${inquiry.subject}">件名</h1>

  <div class="card">
    <div class="meta">
      <span th:text="${inquiry.customerName}"></span>
      (<span th:text="${inquiry.customerEmail}"></span>) ・
      受付: <span th:text="${#temporals.format(inquiry.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
    </div>
    <p class="pre" th:text="${inquiry.body}"></p>
  </div>

  <form class="row" th:action="@{/admin/inquiries/{id}/status(id=${inquiry.id})}" method="post">
    <span>状態:</span>
    <select name="status">
      <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
              th:selected="${s == inquiry.status}"></option>
    </select>
    <button type="submit" class="secondary">変更</button>
  </form>

  <h2>対応履歴</h2>
  <p th:if="${#lists.isEmpty(inquiry.replies)}" class="meta">まだ返信はありません。</p>
  <div class="card" th:each="r : ${inquiry.replies}">
    <div class="meta">
      <span th:text="${#temporals.format(r.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
      <span class="ai-tag" th:if="${r.aiDraft}">(AI下書きをもとに作成)</span>
      <span class="sent-tag" th:if="${r.emailedAt != null}"
            th:text="'メール送信済み ' + ${#temporals.format(r.emailedAt, 'yyyy/MM/dd HH:mm')}"></span>
      <span class="meta" th:if="${r.emailedAt == null}">(メール未送信)</span>
    </div>
    <p class="pre" th:text="${r.body}"></p>
  </div>

  <h2>返信する</h2>
  <p class="info-box" th:if="${info}" th:text="${info}"></p>
  <p class="error-box" th:if="${error}" th:text="${error}"></p>

  <form th:action="@{/admin/inquiries/{id}/draft(id=${inquiry.id})}" method="post">
    <button type="submit" class="secondary">AIで返信を下書き生成</button>
    <span class="meta">(数秒かかります。下書きは必ず確認・修正してから使ってください)</span>
  </form>

  <form th:action="@{/admin/inquiries/{id}/replies(id=${inquiry.id})}" method="post">
    <input type="hidden" name="aiDraft" th:value="${draftFromAi == true}">
    <label for="reply">返信内容</label>
    <textarea id="reply" name="body" rows="10" th:text="${draft}"></textarea>
    <p class="row">
      <button type="submit" class="secondary">返信を保存(送信しない)</button>
      <button type="submit" name="send" value="true"
              onclick="return confirm('お客様のメールアドレス宛てに送信します。内容を確認しましたか?')">保存してメール送信</button>
    </p>
    <p class="meta">送信先: <span th:text="${inquiry.customerEmail}"></span></p>
  </form>

  <h2>この問い合わせを削除</h2>
  <form th:action="@{/admin/inquiries/{id}/delete(id=${inquiry.id})}" method="post"
        onsubmit="return confirm('この問い合わせと対応履歴をすべて削除します。元に戻せません。よろしいですか?')">
    <button type="submit" class="danger">削除する</button>
  </form>
</main>
</body>
</html>
