<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問い合わせ一覧</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main>
  <div class="row between">
    <h1>問い合わせ一覧</h1>
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="secondary">ログアウト</button>
    </form>
  </div>
  <p class="info-box" th:if="${info}" th:text="${info}"></p>
  <p><a class="button" th:href="@{/contact}">新規登録</a></p>

  <p th:if="${#lists.isEmpty(inquiries)}">まだ問い合わせはありません。</p>

  <table th:unless="${#lists.isEmpty(inquiries)}">
    <tr><th>ID</th><th>件名</th><th>お名前</th><th>状態</th><th>受付日時</th></tr>
    <tr th:each="i : ${inquiries}">
      <td th:text="${i.id}"></td>
      <td><a th:href="@{/admin/inquiries/{id}(id=${i.id})}" th:text="${i.subject}"></a></td>
      <td th:text="${i.customerName}"></td>
      <td><span class="badge" th:classappend="${'s-' + i.status.name()}" th:text="${i.status.label}"></span></td>
      <td th:text="${#temporals.format(i.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
    </tr>
  </table>
</main>
</body>
</html>
